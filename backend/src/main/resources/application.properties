spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:eduscheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SMTP defaults (set password via environment variable only)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=eduscheduler989@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
MAIL_FROM=eduscheduler989@gmail.com
# Frontend base URL for verification links
app.base-url=http://localhost:5173

google.calendar.credentials-path=secrets/google-service-account.json
google.calendar.calendar-id=primary

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=5MB