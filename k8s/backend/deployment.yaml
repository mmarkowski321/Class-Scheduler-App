apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduscheduler-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eduscheduler-backend
  template:
    metadata:
      labels:
        app: eduscheduler-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: backend
          image: 619613970416.dkr.ecr.eu-north-1.amazonaws.com/eduscheduler-backend:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/eduscheduler
          envFrom:
            - secretRef:
                name: postgres-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi


